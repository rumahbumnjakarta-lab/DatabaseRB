<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Database Rumah BUMN Jakarta</title>
<meta name="description" content="Komunikasi internal Rumah BUMN Jakarta: ruang semua anggota, ruang divisi, dan pesan pribadi.">
<link rel="stylesheet" href="style.css">
<style>
  /* ─── Chat workspace: daftar ruang di kiri, percakapan di kanan ─── */
  .chat-wrap {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 16px;
    height: calc(100vh - var(--topbar-h) - 48px);
    min-height: 480px;
  }

  .chat-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0; /* izinkan anak scroll di dalam grid */
  }

  /* ── Kolom kiri ── */
  .chat-side-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .chat-side-head h2 {
    font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0; flex: 1;
  }
  .btn-new-dm {
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--blue-mid); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; flex-shrink: 0;
  }
  .btn-new-dm:hover { background: var(--blue-mid); color: #fff; border-color: var(--blue-mid); }

  .chat-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .chat-search input {
    width: 100%; box-sizing: border-box;
    padding: 8px 12px; font-size: 12.5px; font-family: 'Inter', sans-serif;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg-input); color: var(--text-primary); outline: none;
    transition: all 0.2s ease;
  }
  .chat-search input:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(21,94,239,0.1); }

  .chat-room-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
  .chat-group-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--text-muted);
    padding: 12px 10px 6px; opacity: 0.85;
  }
  .chat-room {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 11px; cursor: pointer;
    transition: background 0.15s ease;
    border: 1px solid transparent;
  }
  .chat-room:hover { background: var(--bg-card-hover); }
  .chat-room.active { background: var(--blue-active-bg); border-color: rgba(21,94,239,0.2); }
  .chat-room-avatar {
    width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
  }
  .chat-room-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-room-avatar.is-global   { background: linear-gradient(135deg, #0e7490, #0891b2); }
  .chat-room-avatar.is-division { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
  .chat-room-body { flex: 1; min-width: 0; }
  .chat-room-name {
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-room-last {
    font-size: 11.5px; color: var(--text-muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-room-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .chat-room-time { font-size: 10px; color: var(--text-muted); }
  .chat-unread {
    min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 9px; background: var(--blue-mid); color: #fff;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Kolom kanan ── */
  .chat-thread-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .chat-thread-head h3 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0; }
  .chat-thread-head p { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 0; }
  .btn-back-rooms {
    display: none; /* hanya tampil di layar sempit */
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-secondary); cursor: pointer;
    align-items: center; justify-content: center;
  }

  .chat-messages {
    flex: 1; overflow-y: auto; min-height: 0;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
    background: var(--bg-app);
  }
  .chat-date-sep {
    align-self: center; font-size: 10.5px; font-weight: 600; color: var(--text-muted);
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 3px 12px; border-radius: 20px; margin: 6px 0;
  }
  .msg { max-width: 68%; display: flex; flex-direction: column; gap: 3px; position: relative; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg-sender { font-size: 11px; font-weight: 700; color: var(--blue-mid); padding: 0 4px; }
  .msg-row { display: flex; align-items: flex-end; gap: 4px; }
  .msg.mine .msg-row { flex-direction: row-reverse; }
  .msg-bubble {
    padding: 9px 13px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.5; color: var(--text-primary);
    background: var(--bg-card); border: 1px solid var(--border);
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.mine .msg-bubble {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    border-color: transparent; color: #fff;
  }
  .msg-bubble.deleted { font-style: italic; color: var(--text-muted); background: var(--bg-surface); }
  .msg.mine .msg-bubble.deleted { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.75); }
  .msg-time { font-size: 10px; color: var(--text-muted); padding: 0 4px; display: flex; align-items: center; gap: 4px; }
  .msg-edited-tag { opacity: 0.75; }
  .msg-forwarded-tag {
    font-size: 10.5px; font-weight: 600; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px; padding: 0 4px;
  }
  .mention-chip {
    background: rgba(21,94,239,0.14); color: var(--blue-mid); font-weight: 700;
    padding: 1px 5px; border-radius: 6px;
  }
  .msg.mine .mention-chip { background: rgba(255,255,255,0.22); color: #fff; }

  /* Hover action row (Forward / Edit / Delete) — sits beside the bubble */
  .msg-actions {
    display: flex; align-items: center; gap: 2px;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
    flex-shrink: 0; margin-bottom: 2px;
  }
  .msg:hover .msg-actions { opacity: 1; pointer-events: auto; }
  .msg-action-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none;
    background: var(--bg-card); color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(15,23,42,0.1);
    transition: all 0.15s ease;
  }
  .msg-action-btn:hover { background: var(--blue-active-bg); color: var(--blue-mid); }
  .msg-action-btn.danger:hover { background: rgba(220,38,38,0.1); color: #dc2626; }

  /* Agenda card message */
  .msg-agenda-card {
    display: block; text-decoration: none; width: 240px; max-width: 100%;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .msg-agenda-card:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(15,23,42,0.1); }
  .mac-head {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .mac-body { padding: 12px 14px; }
  .mac-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); line-height: 1.35; margin-bottom: 6px; }
  .mac-meta { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 3px; }
  .mac-link {
    display: flex; align-items: center; gap: 5px; padding: 8px 14px;
    border-top: 1px dashed var(--border); font-size: 11.5px; font-weight: 700; color: var(--blue-mid);
  }

  /* @mention autocomplete popup, anchored above the composer */
  .mention-pop {
    position: absolute; bottom: calc(100% + 8px); left: 14px; width: 260px; max-height: 220px;
    overflow-y: auto; background: #fff; border: 1px solid var(--border-mid); border-radius: 12px;
    box-shadow: 0 16px 36px rgba(15,23,42,0.16); padding: 6px; display: none; z-index: 20;
  }
  .mention-pop.open { display: block; }
  .mention-row {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
  }
  .mention-row:hover, .mention-row.hi { background: var(--blue-active-bg); }
  .mention-row .contact-avatar { width: 28px; height: 28px; font-size: 11px; }
  .mention-row .mr-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }

  /* Reply/Edit context banner above the composer */
  .composer-context {
    display: none; align-items: center; gap: 8px; padding: 8px 14px;
    border-top: 1px solid var(--border); background: var(--bg-surface);
    font-size: 12px; color: var(--text-secondary);
  }
  .composer-context.open { display: flex; }
  .composer-context i[data-lucide] { color: var(--blue-mid); flex-shrink: 0; }
  .composer-context .cc-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer-context .cc-close { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; flex-shrink: 0; }

  .chat-composer {
    padding: 12px 14px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    background: var(--bg-card);
  }
  .chat-composer textarea {
    flex: 1; resize: none; max-height: 120px; min-height: 40px;
    padding: 10px 14px; font-size: 13.5px; font-family: 'Inter', sans-serif;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg-input); color: var(--text-primary);
    outline: none; line-height: 1.5; transition: all 0.2s ease;
  }
  .chat-composer textarea:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(21,94,239,0.1); }
  .btn-send {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    border: none; background: var(--blue-mid); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(21,94,239,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .btn-send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(21,94,239,0.45); }
  .btn-send:disabled { opacity: 0.45; cursor: not-allowed; }

  .chat-placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px 24px; color: var(--text-muted);
  }
  .chat-placeholder .cp-ico {
    width: 64px; height: 64px; border-radius: 18px; margin-bottom: 14px;
    background: var(--icon-bg-blue); color: var(--icon-blue);
    display: flex; align-items: center; justify-content: center; opacity: 0.85;
  }
  .chat-placeholder h4 { font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
  .chat-placeholder p { font-size: 12.5px; margin: 0; }

  /* ── Modal kontak ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    z-index: 2000; opacity: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.25s ease; padding: 16px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--bg-card); border: 1px solid var(--border-mid);
    border-radius: 20px; width: 100%; max-width: 440px;
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 64px rgba(15,23,42,0.2);
    transform: translateY(16px); transition: transform 0.25s ease;
  }
  .modal-overlay.open .modal-box { transform: translateY(0); }
  .modal-head {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); margin: 0; flex: 1; }
  .modal-close {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    padding: 4px; border-radius: 8px; display: flex;
  }
  .modal-close:hover { color: var(--text-primary); background: var(--bg-surface); }
  .modal-body { overflow-y: auto; padding: 10px; }
  .contact-row {
    display: flex; align-items: center; gap: 11px;
    padding: 10px; border-radius: 11px; cursor: pointer; transition: background 0.15s ease;
  }
  .contact-row:hover { background: var(--bg-card-hover); }
  .contact-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contact-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .contact-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

  @media (max-width: 860px) {
    /* Satu panel penuh layar: daftar ruang ATAU percakapan, bukan keduanya */
    .chat-wrap { grid-template-columns: 1fr; height: calc(100vh - var(--topbar-h) - 100px); }
    .chat-wrap[data-view="thread"] .chat-side { display: none; }
    .chat-wrap[data-view="list"]   .chat-main { display: none; }
    .btn-back-rooms { display: flex; }
    .msg { max-width: 85%; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div id="sidebarContainer"></div>
  <main class="app-main">
    <div class="app-topbar">
      <button class="sidebar-toggle" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Chat <small>Komunikasi internal tim</small></div>
    </div>

    <div id="appContent" class="app-content" style="display:none;">
      <div class="chat-wrap" id="chatWrap" data-view="list">

        <!-- Daftar ruang -->
        <div class="chat-panel chat-side">
          <div class="chat-side-head">
            <h2>Obrolan</h2>
            <button class="btn-new-dm" onclick="openContacts()" title="Mulai obrolan pribadi">
              <i data-lucide="pen-square" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="chat-search">
            <input type="text" id="roomSearch" placeholder="Cari obrolan..." oninput="renderRooms()">
          </div>
          <div class="chat-room-list" id="roomList">
            <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Memuat obrolan...</div>
          </div>
        </div>

        <!-- Percakapan -->
        <div class="chat-panel chat-main">
          <div id="threadEmpty" class="chat-placeholder">
            <div class="cp-ico"><i data-lucide="message-circle" style="width:28px;height:28px;"></i></div>
            <h4>Pilih obrolan</h4>
            <p>Pilih ruang di sebelah kiri, atau mulai obrolan pribadi baru.</p>
          </div>

          <div id="threadView" style="display:none;flex-direction:column;flex:1;min-height:0;">
            <div class="chat-thread-head">
              <button class="btn-back-rooms" onclick="showRoomList()" title="Kembali">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
              </button>
              <div class="chat-room-avatar" id="threadAvatar">#</div>
              <div style="flex:1;min-width:0;">
                <h3 id="threadTitle">—</h3>
                <p id="threadSub"></p>
              </div>
            </div>

            <div class="chat-messages" id="messageList"></div>

            <div class="composer-context" id="composerContext">
              <i data-lucide="pencil" style="width:14px;height:14px;"></i>
              <span class="cc-text" id="composerContextText">Mengedit pesan</span>
              <button class="cc-close" onclick="cancelEdit()" title="Batal"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
            </div>
            <div class="chat-composer" style="position:relative;">
              <div class="mention-pop" id="mentionPop"></div>
              <textarea id="msgInput" rows="1" placeholder="Tulis pesan... (@ untuk tag seseorang)"
                        title="Enter untuk kirim, Shift+Enter untuk baris baru, @ untuk tag"
                        oninput="handleComposerInput(this)" onkeydown="handleComposerKey(event)"></textarea>
              <button class="btn-send" id="btnSend" onclick="sendMessage()" title="Kirim">
                <i data-lucide="send" style="width:17px;height:17px;"></i>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- Modal pilih kontak -->
<div class="modal-overlay" id="contactsModal" onclick="if(event.target===this) closeContacts()">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Mulai Obrolan Pribadi</h3>
      <button class="modal-close" onclick="closeContacts()" title="Tutup">
        <i data-lucide="x" style="width:18px;height:18px;"></i>
      </button>
    </div>
    <div class="chat-search">
      <input type="text" id="contactSearch" placeholder="Cari nama atau email..." oninput="renderContacts()">
    </div>
    <div class="modal-body" id="contactList"></div>
  </div>
</div>

<!-- Modal forward pesan -->
<div class="modal-overlay" id="forwardModal" onclick="if(event.target===this) closeForward()">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Teruskan Pesan</h3>
      <button class="modal-close" onclick="closeForward()" title="Tutup">
        <i data-lucide="x" style="width:18px;height:18px;"></i>
      </button>
    </div>
    <div class="chat-search">
      <input type="text" id="forwardSearch" placeholder="Cari obrolan atau orang..." oninput="renderForwardTargets()">
    </div>
    <div class="modal-body" id="forwardTargetList"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
var ME = null;
var ROOMS = [];
var CONTACTS = [];
var ACTIVE = null;          // ruang yang sedang dibuka
var LAST_AT = null;         // timestamp pesan terakhir yang sudah dirender
var pollTimer = null;
var MSG_CACHE = {};         // id -> objek pesan, dipakai saat edit/forward
var EDITING_ID = null;      // id pesan yang sedang diedit (null = mode kirim baru)
var MENTION_QUERY_START = -1; // posisi karakter "@" aktif di textarea, -1 = tidak aktif
var MENTION_HI = -1;        // index kandidat yang sedang di-highlight (panah atas/bawah)
var MENTION_MATCHES = [];
var FORWARD_MSG_ID = null;
var ROOM_MEMBERS_CACHE = {}; // room id -> [contact,...], dipakai buat batasi @tag sesuai ruang

initAppShell('chat', function(user) {
  ME = user;
  // Kontak dimuat di awal (bukan cuma saat modal "Obrolan Baru" dibuka) supaya
  // autocomplete @mention langsung siap begitu user mulai mengetik.
  const contactsPromise = fetch('/api/chat/contacts').then(r => r.json()).then(list => { if (Array.isArray(list)) CONTACTS = list; }).catch(() => {});
  // maybeHandleSharedAgenda() butuh ROOMS dan CONTACTS sudah terisi (dia
  // langsung menampilkan picker "kirim ke mana"), jadi tunggu keduanya
  // selesai dulu — kalau tidak, daftar tujuannya akan tampil kosong.
  Promise.all([loadRooms(true), contactsPromise]).then(() => {
    maybeHandleSharedAgenda();
    // Deep-link dari notifikasi bell: /chat.html?room=<id> langsung buka ruangnya.
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('room');
    if (roomId) {
      history.replaceState(null, '', '/chat.html');
      openRoom(roomId);
    }
  });
  // Polling ringan: pesan baru di ruang aktif + penyegaran daftar ruang.
  pollTimer = setInterval(pollUpdates, 4000);
});

// Hentikan polling saat tab disembunyikan agar tidak boros request.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  } else if (!pollTimer) {
    pollUpdates();
    pollTimer = setInterval(pollUpdates, 4000);
  }
});

// ─── Ruang ───
function loadRooms(selectFirst) {
  return fetch('/api/chat/rooms')
    .then(r => r.json())
    .then(rooms => {
      if (rooms && rooms.error) throw new Error(rooms.error);
      ROOMS = rooms || [];
      renderRooms();
      if (typeof updateTopbarNotifications === 'function') updateTopbarNotifications(rooms);
      if (selectFirst && !ACTIVE && ROOMS.length && window.innerWidth > 860) {
        openRoom(ROOMS[0].id);
      }
    })
    .catch(err => {
      document.getElementById('roomList').innerHTML =
        `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">
           Gagal memuat obrolan.<br><span style="font-size:11px;">${escHtml(err.message)}</span>
         </div>`;
    });
}

function renderRooms() {
  const q = (document.getElementById('roomSearch').value || '').toLowerCase().trim();
  const list = document.getElementById('roomList');
  const match = r => !q || r.label.toLowerCase().includes(q) || (r.last_body || '').toLowerCase().includes(q);

  const groups = [
    { key: 'global',   label: 'Semua Anggota' },
    { key: 'division', label: 'Ruang Divisi' },
    { key: 'dm',       label: 'Pesan Pribadi' }
  ];

  let html = '';
  groups.forEach(g => {
    const rooms = ROOMS.filter(r => r.type === g.key && match(r));
    if (!rooms.length) return;
    html += `<div class="chat-group-label">${g.label}</div>`;
    rooms.forEach(r => { html += roomRowHTML(r); });
  });

  if (!html) {
    html = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">
              ${q ? 'Tidak ada obrolan yang cocok.' : 'Belum ada obrolan.'}
            </div>`;
  }
  list.innerHTML = html;
  renderIcons();
}

function roomRowHTML(r) {
  const active = ACTIVE && String(ACTIVE.id) === String(r.id);
  const avatarClass = r.type === 'global' ? 'is-global' : (r.type === 'division' ? 'is-division' : '');
  const avatarInner = r.avatar
    ? `<img src="${escHtml(r.avatar)}" alt="">`
    : (r.type === 'dm' ? escHtml(initialOf(r.label)) : (r.type === 'global' ? '#' : escHtml(initialOf(r.label))));

  const preview = r.last_body
    ? (r.type !== 'dm' && r.last_sender ? `${escHtml(shortName(r.last_sender))}: ` : '') + escHtml(r.last_body)
    : 'Belum ada pesan';

  return `
    <div class="chat-room${active ? ' active' : ''}" onclick="openRoom('${r.id}')">
      <div class="chat-room-avatar ${avatarClass}">${avatarInner}</div>
      <div class="chat-room-body">
        <div class="chat-room-name">${escHtml(r.label)}</div>
        <div class="chat-room-last">${preview}</div>
      </div>
      <div class="chat-room-meta">
        ${r.last_at ? `<span class="chat-room-time">${shortTime(r.last_at)}</span>` : ''}
        ${r.unread ? `<span class="chat-unread">${r.unread > 99 ? '99+' : r.unread}</span>` : ''}
      </div>
    </div>`;
}

function openRoom(id) {
  const room = ROOMS.find(r => String(r.id) === String(id));
  if (!room) return;
  ACTIVE = room;
  LAST_AT = null;

  document.getElementById('threadEmpty').style.display = 'none';
  document.getElementById('threadView').style.display = 'flex';
  document.getElementById('threadTitle').textContent = room.label;
  document.getElementById('threadSub').textContent = room.subtitle || '';

  const av = document.getElementById('threadAvatar');
  av.className = 'chat-room-avatar ' +
    (room.type === 'global' ? 'is-global' : room.type === 'division' ? 'is-division' : '');
  av.innerHTML = room.avatar
    ? `<img src="${escHtml(room.avatar)}" alt="">`
    : (room.type === 'global' ? '#' : escHtml(initialOf(room.label)));

  document.getElementById('chatWrap').setAttribute('data-view', 'thread');
  document.getElementById('messageList').innerHTML =
    `<div style="margin:auto;color:var(--text-muted);font-size:12.5px;">Memuat pesan...</div>`;

  renderRooms();

  fetch(`/api/chat/rooms/${room.id}/messages`)
    .then(r => r.json())
    .then(msgs => {
      if (msgs && msgs.error) throw new Error(msgs.error);
      renderMessages(msgs || [], true);
      markRead(room.id);
    })
    .catch(err => {
      document.getElementById('messageList').innerHTML =
        `<div style="margin:auto;color:var(--text-muted);font-size:12.5px;">${escHtml(err.message)}</div>`;
    });

  ensureRoomMembers(room.id);
}

// Anggota ruang dipakai untuk membatasi autocomplete @tag — di ruang divisi
// Design, misalnya, cuma menawarkan orang Design + staff, bukan seluruh
// organisasi. Dimuat sekali per ruang lalu di-cache (anggota jarang berubah
// selagi satu sesi chat berlangsung).
function ensureRoomMembers(roomId) {
  if (ROOM_MEMBERS_CACHE[roomId]) return Promise.resolve(ROOM_MEMBERS_CACHE[roomId]);
  return fetch(`/api/chat/rooms/${roomId}/members`)
    .then(r => r.json())
    .then(list => {
      ROOM_MEMBERS_CACHE[roomId] = Array.isArray(list) ? list : [];
      return ROOM_MEMBERS_CACHE[roomId];
    })
    .catch(() => { ROOM_MEMBERS_CACHE[roomId] = []; return []; });
}

function showRoomList() {
  document.getElementById('chatWrap').setAttribute('data-view', 'list');
}

// ─── Pesan ───
function renderMessages(msgs, replace) {
  const box = document.getElementById('messageList');
  if (replace) box.innerHTML = '';

  if (replace && !msgs.length) {
    box.innerHTML = `<div style="margin:auto;text-align:center;color:var(--text-muted);font-size:12.5px;">
        Belum ada pesan di ruang ini.<br>Mulai percakapan dengan menulis di bawah.
      </div>`;
    return;
  }
  // Placeholder "belum ada pesan" harus hilang begitu pesan pertama masuk.
  if (!replace && box.querySelector('div[style*="margin:auto"]')) box.innerHTML = '';

  let lastDay = box.getAttribute('data-last-day') || '';
  msgs.forEach(m => {
    const day = new Date(m.created_at).toDateString();
    if (day !== lastDay) {
      const sep = document.createElement('div');
      sep.className = 'chat-date-sep';
      sep.textContent = dayLabel(m.created_at);
      box.appendChild(sep);
      lastDay = day;
    }

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (m.mine ? ' mine' : '');
    // Nama pengirim hanya relevan di ruang beranggota banyak.
    const showSender = !m.mine && ACTIVE && ACTIVE.type !== 'dm';
    MSG_CACHE[m.id] = m;
    wrap.id = 'msg-' + m.id;
    wrap.innerHTML =
      (showSender ? `<div class="msg-sender">${escHtml(m.sender_name)}</div>` : '') +
      (!m.deleted && m.meta && m.meta.forwarded ? `<div class="msg-forwarded-tag"><i data-lucide="forward" style="width:11px;height:11px;"></i> Diteruskan</div>` : '') +
      `<div class="msg-row">${msgActionsHTML(m)}${msgBubbleHTML(m)}</div>` +
      `<div class="msg-time">${shortTime(m.created_at)}${(!m.deleted && m.edited_at) ? ' · <span class="msg-edited-tag">diedit</span>' : ''}</div>`;
    box.appendChild(wrap);

    LAST_AT = m.created_at;
  });
  box.setAttribute('data-last-day', lastDay);
  box.scrollTop = box.scrollHeight;
  renderIcons();
}

function msgBubbleHTML(m) {
  if (m.deleted) {
    return `<div class="msg-bubble deleted"><i data-lucide="ban" style="width:12px;height:12px;vertical-align:-2px;margin-right:5px;"></i>Pesan ini telah dihapus</div>`;
  }
  if (m.msg_type === 'agenda' && m.meta) {
    const meta = m.meta;
    return `
      <a class="msg-agenda-card" href="/agenda-hub.html">
        <div class="mac-head"><i data-lucide="calendar-days" style="width:14px;height:14px;"></i> Silabus</div>
        <div class="mac-body">
          <div class="mac-title">${escHtml(meta.title || 'Acara')}</div>
          ${meta.event_date ? `<div class="mac-meta"><i data-lucide="calendar" style="width:12px;height:12px;"></i>${escHtml(formatAgendaDate(meta.event_date))}</div>` : ''}
          ${meta.location ? `<div class="mac-meta"><i data-lucide="map-pin" style="width:12px;height:12px;"></i>${escHtml(meta.location)}</div>` : ''}
        </div>
        <div class="mac-link">Lihat di Silabus <i data-lucide="arrow-right" style="width:12px;height:12px;"></i></div>
      </a>`;
  }
  return `<div class="msg-bubble">${highlightMentions(escHtml(m.body), m.mentions)}</div>`;
}

function msgActionsHTML(m) {
  if (m.deleted) return '';
  const btns = [];
  btns.push(`<button class="msg-action-btn" onclick="forwardMessage('${m.id}')" title="Teruskan"><i data-lucide="forward" style="width:13px;height:13px;"></i></button>`);
  if (m.mine && m.msg_type === 'text') {
    btns.push(`<button class="msg-action-btn" onclick="startEditMessage('${m.id}')" title="Edit"><i data-lucide="pencil" style="width:13px;height:13px;"></i></button>`);
  }
  if (m.mine) {
    btns.push(`<button class="msg-action-btn danger" onclick="deleteMessage('${m.id}')" title="Hapus"><i data-lucide="trash-2" style="width:13px;height:13px;"></i></button>`);
  }
  return `<div class="msg-actions">${btns.join('')}</div>`;
}

// Menyorot "@Nama Lengkap" yang cocok dengan salah satu user yang di-tag.
// Dijalankan SETELAH escHtml, jadi menandingkan nama yang juga sudah di-escape
// supaya tidak pernah menyuntikkan HTML mentah dari isi pesan.
function highlightMentions(escapedBody, mentionIds) {
  if (!mentionIds || !mentionIds.length) return escapedBody;
  const names = mentionIds.map(id => nameOf(id)).filter(Boolean).map(escHtml);
  if (!names.length) return escapedBody;
  // Nama terpanjang dulu supaya "Rina" tidak mencegat "Rina Pratiwi".
  names.sort((a, b) => b.length - a.length);
  let out = escapedBody;
  names.forEach(name => {
    const re = new RegExp('@' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    out = out.replace(re, `<span class="mention-chip">@${name}</span>`);
  });
  return out;
}

function nameOf(userId) {
  if (ME && String(ME.id) === String(userId)) return ME.name;
  const c = CONTACTS.find(c => String(c.id) === String(userId));
  return c ? c.name : null;
}

function formatAgendaDate(dateStr) {
  try {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  } catch (e) { return dateStr; }
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if (!body || !ACTIVE) return;
  closeMentionPopup();

  const mentions = resolveMentionsFromText(body);
  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  input.value = '';
  autoGrow(input);

  const isEdit = !!EDITING_ID;
  const url = isEdit
    ? `/api/chat/rooms/${ACTIVE.id}/messages/${EDITING_ID}`
    : `/api/chat/rooms/${ACTIVE.id}/messages`;

  fetch(url, {
    method: isEdit ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ body, mentions })
  })
    .then(r => r.json())
    .then(msg => {
      if (msg.error) throw new Error(msg.error);
      if (isEdit) {
        cancelEdit();
        patchMessageInPlace(msg);
      } else {
        renderMessages([msg], false);
      }
      loadRooms(false);
    })
    .catch(err => {
      // Kembalikan teks agar pesan tidak hilang saat gagal terkirim.
      input.value = body;
      autoGrow(input);
      showSwalToast(err.message || 'Gagal mengirim pesan.', 'error');
    })
    .finally(() => { btn.disabled = false; input.focus(); });
}

// Menimpa satu bubble yang sudah ada di layar (dipakai setelah edit/hapus)
// tanpa perlu me-render ulang seluruh daftar pesan.
function patchMessageInPlace(msg) {
  MSG_CACHE[msg.id] = msg;
  const el = document.getElementById('msg-' + msg.id);
  if (!el) return;
  const showSender = !msg.mine && ACTIVE && ACTIVE.type !== 'dm';
  el.innerHTML =
    (showSender ? `<div class="msg-sender">${escHtml(msg.sender_name)}</div>` : '') +
    (!msg.deleted && msg.meta && msg.meta.forwarded ? `<div class="msg-forwarded-tag"><i data-lucide="forward" style="width:11px;height:11px;"></i> Diteruskan</div>` : '') +
    `<div class="msg-row">${msgActionsHTML(msg)}${msgBubbleHTML(msg)}</div>` +
    `<div class="msg-time">${shortTime(msg.created_at)}${(!msg.deleted && msg.edited_at) ? ' · <span class="msg-edited-tag">diedit</span>' : ''}</div>`;
  renderIcons();
}

// ─── Edit pesan ───
function startEditMessage(id) {
  const m = MSG_CACHE[id];
  if (!m || !m.mine || m.msg_type !== 'text' || m.deleted) return;
  EDITING_ID = id;
  const input = document.getElementById('msgInput');
  input.value = m.body;
  autoGrow(input);
  input.focus();
  document.getElementById('composerContextText').textContent = 'Mengedit pesan';
  document.getElementById('composerContext').classList.add('open');
}

function cancelEdit() {
  EDITING_ID = null;
  document.getElementById('composerContext').classList.remove('open');
  const input = document.getElementById('msgInput');
  input.value = '';
  autoGrow(input);
}

// ─── Hapus pesan ───
function deleteMessage(id) {
  const m = MSG_CACHE[id];
  if (!m || !m.mine) return;
  showSwalConfirm(
    'Hapus pesan ini?',
    'Pesan akan diganti dengan "Pesan ini telah dihapus" untuk semua orang di ruang ini.',
    'Ya, hapus',
    () => {
      fetch(`/api/chat/rooms/${ACTIVE.id}/messages/${id}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(result => {
          if (result.error) throw new Error(result.error);
          patchMessageInPlace({ ...m, deleted: true, body: '', meta: null, mentions: [] });
          loadRooms(false);
        })
        .catch(err => showSwalToast(err.message || 'Gagal menghapus pesan.', 'error'));
    }
  );
}

// ─── Teruskan pesan ───
function forwardMessage(id) {
  FORWARD_MSG_ID = id;
  document.getElementById('forwardModal').classList.add('open');
  document.getElementById('forwardSearch').value = '';
  renderForwardTargets();
}

function closeForward() {
  FORWARD_MSG_ID = null;
  document.getElementById('forwardModal').classList.remove('open');
}

function renderForwardTargets() {
  const q = (document.getElementById('forwardSearch').value || '').toLowerCase().trim();
  const box = document.getElementById('forwardTargetList');

  const roomRows = ROOMS.filter(r => !q || r.label.toLowerCase().includes(q)).map(r => `
    <div class="contact-row" onclick="doForward('room','${r.id}')">
      <div class="contact-avatar">${r.avatar ? `<img src="${escHtml(r.avatar)}" alt="">` : escHtml(initialOf(r.label))}</div>
      <div style="flex:1;min-width:0;">
        <div class="contact-name">${escHtml(r.label)}</div>
        <div class="contact-sub">${r.type === 'global' ? 'Semua Anggota' : r.type === 'division' ? 'Ruang Divisi' : 'Pesan Pribadi'}</div>
      </div>
    </div>`);

  const roomUserIds = new Set(ROOMS.filter(r => r.type === 'dm').map(r => String(r.partner_id)));
  const contactRows = CONTACTS
    .filter(c => !roomUserIds.has(String(c.id)) && (!q || (c.name || '').toLowerCase().includes(q)))
    .map(c => `
    <div class="contact-row" onclick="doForward('user','${c.id}')">
      <div class="contact-avatar">${c.avatar_url ? `<img src="${escHtml(c.avatar_url)}" alt="">` : escHtml(initialOf(c.name))}</div>
      <div style="flex:1;min-width:0;">
        <div class="contact-name">${escHtml(c.name)}</div>
        <div class="contact-sub">Mulai obrolan baru</div>
      </div>
    </div>`);

  const html = [...roomRows, ...contactRows].join('');
  box.innerHTML = html || `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Tidak ada obrolan yang cocok.</div>`;
}

function doForward(kind, targetId) {
  const original = MSG_CACHE[FORWARD_MSG_ID];
  if (!original) return;

  const send = (roomId) => {
    const payload = original.msg_type === 'agenda'
      ? { msg_type: 'agenda', body: original.body || original.meta.title, meta: original.meta }
      : { body: original.body, meta: { forwarded: true } };
    return fetch(`/api/chat/rooms/${roomId}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(r => r.json());
  };

  const afterSent = (res, roomId) => {
    if (res.error) throw new Error(res.error);
    closeForward();
    showSwalToast('Pesan diteruskan.', 'success');
    loadRooms(false).then(() => openRoom(roomId));
  };

  if (kind === 'room') {
    send(targetId).then(res => afterSent(res, targetId)).catch(err => showSwalToast(err.message || 'Gagal meneruskan pesan.', 'error'));
  } else {
    fetch('/api/chat/dm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: targetId })
    }).then(r => r.json()).then(dm => {
      if (dm.error) throw new Error(dm.error);
      return send(dm.room_id).then(res => afterSent(res, dm.room_id));
    }).catch(err => showSwalToast(err.message || 'Gagal meneruskan pesan.', 'error'));
  }
}

// playChatNotifSound() didefinisikan sekali di shared.js (dipakai juga oleh
// notifier lintas-halaman di sana) — halaman ini memuat shared.js juga,
// jadi cukup pakai fungsi yang sama tanpa duplikasi.

// ─── Kirim kartu Agenda dari halaman Agenda & Event Hub ───
// Halaman itu menaruh detail acara di sessionStorage lalu mengarahkan ke sini
// dengan ?share_agenda=1; kita pakai picker "Teruskan" yang sama untuk memilih
// tujuannya supaya tidak perlu membangun UI room-picker kedua.
function maybeHandleSharedAgenda() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('share_agenda') !== '1') return;
  history.replaceState(null, '', '/chat.html');

  const raw = sessionStorage.getItem('rb_share_agenda');
  sessionStorage.removeItem('rb_share_agenda');
  if (!raw) return;
  let meta;
  try { meta = JSON.parse(raw); } catch (e) { return; }
  if (!meta || !meta.event_id || !meta.title) return;

  MSG_CACHE['__pending_agenda__'] = { id: '__pending_agenda__', msg_type: 'agenda', body: meta.title, meta };
  FORWARD_MSG_ID = '__pending_agenda__';
  document.getElementById('forwardModal').classList.add('open');
  document.getElementById('forwardSearch').value = '';
  renderForwardTargets();
  showSwalToast(`Pilih tujuan untuk membagikan "${meta.title}"`, 'info');
}

function handleComposerKey(e) {
  if (MENTION_QUERY_START >= 0) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveMentionHi(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveMentionHi(-1); return; }
    if ((e.key === 'Enter' || e.key === 'Tab') && MENTION_MATCHES.length) {
      e.preventDefault();
      selectMention(MENTION_MATCHES[Math.max(MENTION_HI, 0)]);
      return;
    }
    if (e.key === 'Escape') { closeMentionPopup(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── @mention: gabungan auto-grow textarea + deteksi "@" untuk autocomplete ───
function handleComposerInput(el) {
  autoGrow(el);

  const pos = el.selectionStart;
  const before = el.value.slice(0, pos);
  const at = before.lastIndexOf('@');

  // "@" hanya memicu popup kalau ia awal kata (bukan bagian dari email dsb)
  // dan belum ada spasi/baris baru antara "@" dan posisi kursor sekarang.
  if (at === -1 || /[\s@]/.test(before.slice(at + 1)) || (at > 0 && !/\s/.test(before[at - 1]))) {
    closeMentionPopup();
    return;
  }

  const query = before.slice(at + 1).toLowerCase();
  MENTION_MATCHES = activeRoomMembers().filter(c => (c.name || '').toLowerCase().includes(query)).slice(0, 6);
  if (!MENTION_MATCHES.length) { closeMentionPopup(); return; }

  MENTION_QUERY_START = at;
  MENTION_HI = 0;
  renderMentionPopup();
}

function renderMentionPopup() {
  const pop = document.getElementById('mentionPop');
  pop.innerHTML = MENTION_MATCHES.map((c, i) => `
    <div class="mention-row${i === MENTION_HI ? ' hi' : ''}" onmousedown="event.preventDefault(); selectMention(MENTION_MATCHES[${i}])">
      <div class="contact-avatar">${c.avatar_url ? `<img src="${escHtml(c.avatar_url)}" alt="">` : escHtml(initialOf(c.name))}</div>
      <div class="mr-name">${escHtml(c.name)}</div>
    </div>`).join('');
  pop.classList.add('open');
  renderIcons();
}

function moveMentionHi(dir) {
  MENTION_HI = (MENTION_HI + dir + MENTION_MATCHES.length) % MENTION_MATCHES.length;
  renderMentionPopup();
}

function closeMentionPopup() {
  MENTION_QUERY_START = -1;
  MENTION_MATCHES = [];
  document.getElementById('mentionPop').classList.remove('open');
}

function selectMention(contact) {
  const input = document.getElementById('msgInput');
  const pos = input.selectionStart;
  const before = input.value.slice(0, MENTION_QUERY_START);
  const after = input.value.slice(pos);
  const insert = '@' + contact.name + ' ';
  input.value = before + insert + after;
  const caret = before.length + insert.length;
  input.focus();
  input.setSelectionRange(caret, caret);
  closeMentionPopup();
  autoGrow(input);
}

// Anggota ruang yang sedang dibuka — dasar untuk autocomplete @tag DAN untuk
// mencocokkan "@Nama" di teks pesan. Dibatasi ke ruang ini (bukan CONTACTS
// global) supaya ruang divisi Design, misalnya, tidak menawarkan atau
// menandai orang dari divisi lain — server juga menolaknya kalau dipaksa
// lewat request mentah, ini cuma bikin UI-nya konsisten dengan aturan itu.
function activeRoomMembers() {
  if (!ACTIVE) return [];
  return ROOM_MEMBERS_CACHE[ACTIVE.id] || [];
}

// Mencocokkan "@Nama" di teks pesan terhadap anggota ruang yang benar-benar
// ada, supaya id yang dikirim ke server selalu valid.
function resolveMentionsFromText(text) {
  const found = [];
  activeRoomMembers().forEach(c => {
    if (!c.name) return;
    if (text.includes('@' + c.name)) found.push(c.id);
  });
  return found;
}

function markRead(roomId) {
  fetch(`/api/chat/rooms/${roomId}/read`, { method: 'POST' })
    .then(() => {
      const r = ROOMS.find(x => String(x.id) === String(roomId));
      if (r) { r.unread = 0; renderRooms(); }
    })
    .catch(() => {});
}

function pollUpdates() {
  if (ACTIVE && LAST_AT) {
    fetch(`/api/chat/rooms/${ACTIVE.id}/messages?after=${encodeURIComponent(LAST_AT)}`)
      .then(r => r.json())
      .then(msgs => {
        if (msgs && msgs.error) return;
        if (msgs && msgs.length) {
          renderMessages(msgs, false);
          markRead(ACTIVE.id);
          // Ruang yang sedang dibuka tetap dapat suara — pesan baru dari
          // orang lain, bukan gema dari pesan kita sendiri.
          if (msgs.some(m => !m.mine)) playChatNotifSound();
        }
      })
      .catch(() => {});
  }
  loadRooms(false);
}

// ─── Kontak / DM baru ───
function openContacts() {
  document.getElementById('contactsModal').classList.add('open');
  document.getElementById('contactList').innerHTML =
    `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Memuat kontak...</div>`;

  fetch('/api/chat/contacts')
    .then(r => r.json())
    .then(list => {
      if (list && list.error) throw new Error(list.error);
      CONTACTS = list || [];
      renderContacts();
    })
    .catch(err => {
      document.getElementById('contactList').innerHTML =
        `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">${escHtml(err.message)}</div>`;
    });
}

function closeContacts() {
  document.getElementById('contactsModal').classList.remove('open');
}

function renderContacts() {
  const q = (document.getElementById('contactSearch').value || '').toLowerCase().trim();
  const filtered = CONTACTS.filter(c =>
    !q || (c.name || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q));

  const box = document.getElementById('contactList');
  if (!filtered.length) {
    box.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Tidak ada kontak yang cocok.</div>`;
    return;
  }

  box.innerHTML = filtered.map(c => `
    <div class="contact-row" onclick="startDM('${c.id}')">
      <div class="contact-avatar">${c.avatar_url
        ? `<img src="${escHtml(c.avatar_url)}" alt="">`
        : escHtml(initialOf(c.name || c.email))}</div>
      <div style="flex:1;min-width:0;">
        <div class="contact-name">${escHtml(c.name || c.email)}</div>
        <div class="contact-sub">${escHtml(c.divisi || (c.role === 'staff' ? 'Staff' : 'Internship'))}</div>
      </div>
    </div>`).join('');
}

function startDM(userId) {
  fetch('/api/chat/dm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId })
  })
    .then(r => r.json())
    .then(res => {
      if (res.error) throw new Error(res.error);
      closeContacts();
      // Ruang DM mungkin baru dibuat, jadi segarkan daftar sebelum membuka.
      loadRooms(false).then(() => openRoom(res.room_id));
    })
    .catch(err => showSwalToast(err.message || 'Gagal membuka obrolan.', 'error'));
}

// ─── Util ───
function initialOf(s) { return (s || '?').trim().charAt(0).toUpperCase(); }
function shortName(s) { return (s || '').split(' ')[0]; }

function shortTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
}

function dayLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const yst = new Date(now); yst.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Hari Ini';
  if (d.toDateString() === yst.toDateString()) return 'Kemarin';
  return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
